<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BingeTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">

  <section class="landing-hero">
    <div class="landing-overlay"></div>

    <header class="landing-header">
      <a href="landing.html" class="brand-block">
  <span class="brand-main">SERIES TRACKER</span>
</a>

      <a href="login.html" class="header-signin-btn">Sign In</a>
    </header>

    <main class="landing-content">
      <h1 class="landing-title">Track your next binge, all in one place.</h1>
      <h2 class="landing-subtitle">Reviews, favourites, watchlists and more.</h2>
      <p class="landing-description">
        Ready to get started? Enter your email to create or restart your account.
      </p>

      <form class="landing-form" action="signup.html">
        <input type="email" placeholder="Email address" required>
        <button type="submit">Get Started</button>
      </form>
    </main>
  </section>

</body>
</html>
