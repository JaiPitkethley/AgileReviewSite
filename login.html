<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      background:#0B0B12;
      color:#EEEEF5;
      font-family:'Inter', sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card {
      background:#18181F;
      padding:35px;
      border-radius:12px;
      width:320px;
      text-align:center;
      border:1px solid #2A2A38;
    }

    h2 {
      margin-bottom:20px;
    }

    input {
      width:100%;
      padding:12px;
      margin:10px 0;
      background:#111118;
      border:1px solid #2A2A38;
      color:white;
      border-radius:8px;
    }

    button {
      width:100%;
      padding:12px;
      background:#7F77DD;
      border:none;
      color:white;
      border-radius:8px;
      cursor:pointer;
      margin-top:10px;
    }

    button:hover {
      background:#AFA9EC;
    }

    a {
      color:#7F77DD;
      font-size:13px;
      text-decoration:none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Login</h2>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button>Login</button>

  <p style="margin-top:15px;">
    <a href="signup.html">Create account</a>
  </p>
</div>

</body>
</html>
