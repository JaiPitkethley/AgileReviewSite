<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BingeTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="landing.html" class="brand-block">
  <span class="brand-main">SERIES TRACKER</span>
</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Sign In</h1>
      <p class="auth-text">Enter your account details to continue.</p>

      <form class="auth-form" action="reviewsitehome.html">
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>

      <div class="auth-links">
        <p>New to BingeTracker? <a href="signup.html">Create an account</a></p>
        <p><a href="landing.html">← Back to home</a></p>
      </div>
    </section>
  </main>

</body>
</html>
