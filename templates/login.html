<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Series Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="{{ url_for('landing') }}" class="brand-block">
      <span class="brand-main">SERIES TRACKER</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Sign In</h1>
      <p class="auth-text">Enter your account details to continue.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack auth-flashes">
            {% for category, message in messages %}
              <div class="flash-message {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="auth-form" action="{{ url_for('login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          value="{{ request.form.get('email', '') }}"
          required
        >

        <div class="password-field">
          <input
            type="password"
            name="password"
            id="login-password"
            placeholder="Password"
            required
          >
          <button
            type="button"
            class="password-toggle"
            data-target="login-password"
            aria-label="Toggle password visibility"
            aria-pressed="false"
          >
            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"></path>
              <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c5 0 9.3 3 11 7-0.7 1.6-1.8 3.1-3.2 4.2"></path>
              <path d="M6.2 6.3C4.2 7.6 2.7 9.5 2 12c1.7 4 6 7 10 7 1.6 0 3.1-0.3 4.5-0.9"></path>
            </svg>

            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button type="submit">Sign In</button>
      </form>

      <div class="auth-links">
        <p>New to Series Tracker? <a href="{{ url_for('signup') }}">Create an account</a></p>
        <p><a href="{{ url_for('landing') }}">← Back to home</a></p>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('.password-toggle').forEach(button => {
      button.addEventListener('click', function () {
        const input = document.getElementById(this.dataset.target);
        const isHidden = input.type === 'password';

        input.type = isHidden ? 'text' : 'password';
        this.classList.toggle('visible', isHidden);
        this.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
      });
    });
  </script>

</body>
</html>
