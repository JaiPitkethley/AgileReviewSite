<header class="topbar">
  <button type="button" class="hamburger-btn" id="sidebarToggle" aria-label="Toggle sidebar">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="topbar-search-wrapper">
    <form id="topbarSearchForm" class="topbar-search" action="{{ url_for('dashboard') }}" method="get">
      <span class="topbar-search-icon">&#9906;</span>

      <input
        id="topbarSearchInput"
        name="q"
        type="text"
        placeholder="Search series, director, cast..."
        autocomplete="off"
        value="{{ request.args.get('q', '') }}"
      >
      <button type="button" class="topbar-search-clear" id="topbarSearchClear" aria-label="Clear search results">&times;</button>
    </form>
    <div class="topbar-search-dropdown hidden" id="topbarSearchResults"></div>
  </div>

  <div class="topbar-right">
    {% if g.user %}
      <span class="topbar-username">Hi, {{ g.user.username }}</span>
    {% endif %}

    <button type="button" class="theme-toggle">
      ☾ Dark
    </button>

    <button type="button" class="notif-btn">
      ♡
      <span class="notif-dot"></span>
    </button>
  </div>
</header>
