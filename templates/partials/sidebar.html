<aside class="sidebar">

  <div class="sb-logo">
    <div class="sb-logo-text">{{ g.user.username }}</div>
    <div class="sb-logo-sub">Series Tracker</div>
  </div>

  <div class="sb-section">Main</div>
  <nav class="sb-nav">
    <a class="sb-item {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
      <span class="sb-icon">&#9675;</span>
      Discover
    </a>

    <a class="sb-item {% if request.endpoint == 'library' %}active{% endif %}" href="{{ url_for('library') }}">
      <span class="sb-icon">&#9723;</span>
      My Library
    </a>

    <a class="sb-item {% if request.endpoint == 'watchlist' %}active{% endif %}" href="{{ url_for('watchlist') }}">
      <span class="sb-icon">&#9651;</span>
      Watchlist
    </a>

    <a class="sb-item {% if request.endpoint == 'favourites' %}active{% endif %}" href="{{ url_for('favourites') }}">
      <span class="sb-icon">&#9733;</span>
      Favourites
    </a>
  </nav>

  <div class="sb-divider"></div>

  <div class="sb-section">Social</div>
  <nav class="sb-nav">
    <a class="sb-item {% if request.endpoint == 'community' %}active{% endif %}" href="{{ url_for('community') }}">
      <span class="sb-icon">&#9651;</span>
      Community
    </a>

    <a class="sb-item {% if request.endpoint == 'friends' %}active{% endif %}" href="{{ url_for('friends') }}">
      <span class="sb-icon">&#9723;</span>
      Friends
    </a>
  </nav>

  <div class="sb-divider"></div>

  <div class="sb-section">Account</div>
  <nav class="sb-nav">
    <a class="sb-item {% if request.endpoint == 'profile' %}active{% endif %}" href="{{ url_for('profile') }}">
      <span class="sb-icon">&#9651;</span>
      Profile
    </a>

   <a class="sb-item {% if request.endpoint == 'stats' %}active{% endif %}" href="{{ url_for('stats') }}">
      <span class="sb-icon">&#9635;</span>
      Stats
    </a>

    <a class="sb-item {% if request.endpoint == 'settings' %}active{% endif %}" href="{{ url_for('settings') }}">
      <span class="sb-icon">&#9723;</span>
      Settings
    </a>

    <a class="sb-item" href="{{ url_for('logout') }}">
      <span class="sb-icon">&#8617;</span>
      Logout
    </a>
  </nav>

  <div class="sb-bottom">
    <div class="sb-user">
      <div class="sb-avatar">{{ g.user.username[:2] | upper }}</div>
      <div>
        <div class="sb-user-name">{{ g.user.username }}</div>
        <div class="sb-user-sub">{{ g.user.email }}</div>
      </div>
      <span class="sb-cog">&#9881;</span>
    </div>
  </div>

</aside>
